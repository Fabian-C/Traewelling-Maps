<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background rounded icon card -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#glow)"/>

  <!-- Train body outline -->
  <rect x="7" y="6" width="18" height="15" rx="3.5" fill="none" stroke="#f8fafc" stroke-width="1.8"/>

  <!-- Windshield window -->
  <path d="M9 11.5h14" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M16 6.5v5" stroke="#38bdf8" stroke-width="1.4"/>

  <!-- Train Headlights glowing amber -->
  <circle cx="10.5" cy="16.5" r="1.3" fill="#fbbf24"/>
  <circle cx="21.5" cy="16.5" r="1.3" fill="#fbbf24"/>

  <!-- Tracks / Wheel struts -->
  <path d="M11 22.5l-3 4" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M21 22.5l3 4" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M10 25.5h12" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
</svg>