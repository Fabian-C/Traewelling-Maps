<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Clip — Träwelling Map Explorer</title>
    <link rel="icon" type="image/x-icon" href="https://traewelling.de/favicon.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/animation.css">

    <!-- Main Module Entry Point -->
    <script type="module" src="js/animation/app.js"></script>
</head>

<body>
    <!-- Top Sticky Header -->
    <header class="anim-header">
        <a href="index.html" class="anim-brand" id="navHomeLink" aria-label="Return to Interactive Map">
            <span class="anim-brand-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="14" rx="2"></rect>
                    <path d="M4 11h16"></path>
                    <path d="M12 3v8"></path>
                    <path d="m8 19-2 3"></path>
                    <path d="m16 19 2 3"></path>
                </svg>
            </span>
            <h1 class="anim-brand-text">Träwelling Map Explorer</h1>
            <span class="anim-brand-badge">Trip Clip</span>
        </a>

        <!-- Cross-view Navigation -->
        <nav class="anim-nav-links" aria-label="Primary">
            <a href="index.html" class="anim-nav-btn" id="navMapLink">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
                    <line x1="9" y1="3" x2="9" y2="18"></line>
                    <line x1="15" y1="6" x2="15" y2="21"></line>
                </svg>
                <span>Interactive Map</span>
            </a>
            <a href="trips.html" class="anim-nav-btn" id="navTripsLink">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
                <span>Database</span>
            </a>
            <a href="wrapped.html" class="anim-nav-btn" id="navWrappedLink">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
                </svg>
                <span>Wrapped</span>
            </a>
        </nav>
    </header>

    <!-- Toolbar: Account & Journey Selectors + 7 Map Tile Sets -->
    <div class="anim-toolbar" role="toolbar" aria-label="Clip controls">
        <div class="anim-selector-group">
            <label class="anim-select-label" for="userSelect">
                <span>Account:</span>
                <select id="userSelect" class="anim-select"></select>
            </label>

            <label class="anim-select-label" for="tripSelect">
                <span>Journey:</span>
                <select id="tripSelect" class="anim-select anim-select-trip"></select>
            </label>
        </div>

        <div class="anim-selector-group" id="timeframeGroup">
            <label class="anim-select-label" for="timeframeSelect">
                <span>Timeframe:</span>
                <select id="timeframeSelect" class="anim-select">
                    <option value="all">All Time</option>
                    <option value="today">Today / Last 24h</option>
                    <option value="last-7-days">Last 7 Days</option>
                    <option value="this-week">This Week</option>
                    <option value="last-week">Last Week</option>
                    <option value="this-month">This Month</option>
                    <option value="last-30-days">Last 30 Days</option>
                    <option value="this-year">This Year</option>
                    <option value="custom">Custom Date Range…</option>
                </select>
            </label>
            <div class="anim-custom-dates" id="customDateContainer" style="display: none;">
                <label class="anim-date-label" for="timeframeFrom">
                    <span>From:</span>
                    <input type="date" id="timeframeFrom" class="anim-date-input" aria-label="Start date" />
                </label>
                <label class="anim-date-label" for="timeframeTo">
                    <span>To:</span>
                    <input type="date" id="timeframeTo" class="anim-date-input" aria-label="End date" />
                </label>
            </div>
        </div>

        <div class="anim-selector-group">
            <span class="anim-toolbar-label" id="mapStyleGroupLabel">Map Style:</span>
            <div class="aspect-pill-group" role="group" aria-labelledby="mapStyleGroupLabel">
                <button type="button" class="aspect-pill map-style-pill active" data-style="traewelling-dark" aria-pressed="true">Träwelling Dark</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="traewelling-light" aria-pressed="false">Träwelling Light</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="db-light" aria-pressed="false">Modern Light</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="db-dark" aria-pressed="false">Modern Night</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="voyager" aria-pressed="false">Classic Streets</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="topo" aria-pressed="false">Rail &amp; Topo</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="osm-de" aria-pressed="false">Free OSM Rail</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="vector-dark" aria-pressed="false">Vector Dark</button>
                <button type="button" class="aspect-pill map-style-pill" data-style="vector-light" aria-pressed="false">Vector Light</button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="anim-layout">
        <!-- Center Stage: Square 1:1 Video Player -->
        <div class="anim-stage">
            <div id="playerContainer" class="player-host ratio-square">
                <div class="anim-loading">
                    <div class="spinner" aria-hidden="true"></div>
                    <div>Loading clip…</div>
                </div>
            </div>
        </div>

        <!-- Right Sidebar -->
        <aside class="anim-sidebar" aria-label="Trip details">
            <div class="anim-card">
                <h2 class="anim-card-title">Trip Details</h2>

                <dl class="trip-preview-grid">
                    <div class="trip-preview-item">
                        <dt>Line</dt>
                        <dd id="sidebarLine">—</dd>
                    </div>
                    <div class="trip-preview-item">
                        <dt>Distance</dt>
                        <dd id="sidebarDistance">—</dd>
                    </div>
                    <div class="trip-preview-item trip-preview-span-full">
                        <dt>Route</dt>
                        <dd id="sidebarRoute">—</dd>
                    </div>
                    <div class="trip-preview-item">
                        <dt>Delay</dt>
                        <dd id="sidebarDelay">—</dd>
                    </div>
                    <div class="trip-preview-item">
                        <dt>Duration</dt>
                        <dd id="sidebarDuration">—</dd>
                    </div>
                    <div class="trip-preview-item trip-preview-span-full">
                        <dt>Note</dt>
                        <dd id="sidebarNote" class="trip-preview-note">—</dd>
                    </div>
                </dl>

                <div class="anim-download-actions">
                    <button type="button" id="downloadVideoBtn" class="anim-download-btn">
                        Download .webm
                    </button>
                    <div id="recordProgressWrap" class="record-progress-wrap hidden">
                        <div class="record-progress-track">
                            <div id="recordProgressBar" class="record-progress-fill"></div>
                        </div>
                        <div id="recordStatusText" class="record-status-text" aria-live="polite">Preparing…</div>
                    </div>
                </div>
            </div>
        </aside>
    </main>
</body>

</html>
